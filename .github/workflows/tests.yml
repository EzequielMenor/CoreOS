name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  critical-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El harness de tests usa better-sqlite3 (la build de node:sqlite del
      # runner carece de ENABLE_FTS5). Fallar rapido y claro si el backend
      # llega sin FTS5 en vez de reventar en media docena de suites.
      - name: Verify SQLite FTS5 support (test harness)
        run: |
          node -e "
            console.log('node', process.version, 'abi', process.versions.modules);
            const D = require('better-sqlite3');
            const db = new D(':memory:');
            const fts5 = db.prepare('PRAGMA compile_options').all()
              .map((r) => r.compile_options).filter((x) => x.includes('ENABLE_FTS5'));
            if (fts5.length === 0) throw new Error('SQLite backend without ENABLE_FTS5');
            db.exec('CREATE VIRTUAL TABLE t USING fts5(x)');
            console.log('FTS5 OK, sqlite', db.prepare('SELECT sqlite_version() v').get().v);
          "

      - name: Run tests
        run: npm test
